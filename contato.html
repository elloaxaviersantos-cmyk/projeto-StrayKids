<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Stray Kids</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topo">
        <span class="logo"> Stray Kids </span>
        <nav class="menu">
            <a href="index.html" class="ativo">Início</a>
            <a href="sobre.html">Sobre</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main>
        <section class="conteudo">
            <h1>Entre em contato com a STAY!</h1>
            <p>Envie sua mensagem sobre o Stray Kids preenchendo o formulário abaixo.</p>

            <form class="form" action="#">
                <div class="campo">
                    <label for="nome">Nome da STAY</label>
                    <input type="text" id="nome" name="name" placeholder="Seu nome">
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Voce@email.com">
                </div>

                <div class="campo">
                    <label for="msg">Mensagem</label>
                    <textarea name="msg" id="msg" rows="4" placeholder="Escreva sua mensagem sobre o Stray Kids"></textarea>
                </div>

                <button type="submit" class="botao">Enviar mensagem</button>

            </form>
        </section>
    </main>

    <footer class="rodape">
        <p> Feito por Elloa Xavier | STAY ♡ Stray Kids </p>
    </footer>
    
</body>
</html>
